{% load static %}
<article class="mode-card"><a class="mode-art art-{{ mode.slug }}" href="{% url 'core:workshop' mode.slug %}" aria-label="进入{{ mode.name }}工作台"><span class="art-number">{{ mode.number }}</span><img src="{% static 'core/art/' %}{{ mode.motif }}.svg" alt="{{ mode.name }}原创剪纸示意纹样" width="280" height="280"><span class="art-caption">{{ mode.tag }}</span></a><div class="mode-copy"><span class="eyebrow">MODE / {{ mode.number }}</span><h3>{{ mode.name }}</h3><p>{{ mode.description }}</p><a class="text-link" href="{% url 'core:workshop' mode.slug %}">进入工坊 <span aria-hidden="true">↗</span></a></div></article>
