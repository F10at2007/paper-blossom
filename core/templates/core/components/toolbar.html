<aside class="workspace-toolbar" aria-labelledby="tools-title">{% if mode.slug == 'fold' %}{% include 'core/components/fold_tools.html' %}{% elif mode.slug == 'free' %}{% include 'core/components/free_tools.html' %}{% else %}<div class="panel-heading"><h2 id="tools-title">创作工具</h2><span>预留</span></div><div class="tool-list">{% for tool in mode.tools %}<button class="tool-button" data-placeholder="{{ tool }}"><span aria-hidden="true">{% if forloop.first %}◇{% elif forloop.last %}⊞{% else %}✂{% endif %}</span>{{ tool }}<small>待开放</small></button>{% endfor %}</div><div class="paper-options"><h3>纸张颜色</h3><div class="swatches"><button class="swatch cinnabar" aria-label="朱砂红（待开放）" data-placeholder="纸张颜色"></button><button class="swatch ink" aria-label="墨黑（待开放）" data-placeholder="纸张颜色"></button><button class="swatch cream" aria-label="米白（待开放）" data-placeholder="纸张颜色"></button></div><p>朱砂红 · 示意配色</p></div><div class="tool-tip"><span>小小一剪，慢慢来。</span><p>工具暂未开放，当前画布仅用于展示工作台布局。</p></div>{% endif %}</aside>
