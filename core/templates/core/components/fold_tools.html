<div class="panel-heading"><h2 id="tools-title">折叠方式</h2><span>先折后剪</span></div>
<div class="fold-choices" role="group" aria-label="选择折叠方式">
  <button type="button" data-fold="vertical" aria-pressed="false"><span class="fold-icon vertical" aria-hidden="true"></span><span>对折<small>垂直 · 右向左</small></span></button>
  <button type="button" data-fold="horizontal" aria-pressed="false"><span class="fold-icon horizontal" aria-hidden="true"></span><span>对折<small>水平 · 下向上</small></span></button>
  <button type="button" data-fold="quarter" aria-pressed="false"><span class="fold-icon quarter" aria-hidden="true"></span><span>四折<small>两次镜像</small></span></button>
  <button type="button" data-fold="eighth" aria-pressed="false"><span class="fold-icon eighth" aria-hidden="true"></span><span>八折<small>45° 基本扇区</small></span></button>
  <button type="button" data-fold="radial3" aria-pressed="false"><span class="fold-icon radial3" aria-hidden="true"></span><span>三折团花<small>60° 剪裁区 · 三向对称</small></span></button>
  <button type="button" data-fold="radial6" aria-pressed="false"><span class="fold-icon radial6" aria-hidden="true"></span><span>六折团花<small>30° 剪裁区 · 六向对称</small></span></button>
</div>
{% include 'core/components/paper_colors.html' %}
<div class="tool-tip"><span>先折一张纸，再剪一朵花。</span><p id="fold-hint">先选择折叠方式。纸片居中，可从纸外起笔；松手闭合，只剪去与纸片相交的部分。点击展开后揭晓完整作品。</p></div>
