<div class="panel-heading"><h2 id="tools-title">创作工具</h2><span>自由剪艺</span></div>
<div class="tool-list"><div class="tool-button active-tool"><span aria-hidden="true">✂</span>自由剪裁<small>已选</small></div></div>
<div class="paper-options free-paper-options">
  <h3>纸张颜色</h3>
  <div class="swatches" role="group" aria-label="纸张颜色">
    <button type="button" class="swatch" style="--swatch:#a63127" data-color="#a63127" aria-label="朱砂红" aria-pressed="true"></button>
    <button type="button" class="swatch" style="--swatch:#c62828" data-color="#c62828" aria-label="正红" aria-pressed="false"></button>
    <button type="button" class="swatch" style="--swatch:#f4e9d5" data-color="#f4e9d5" aria-label="暖米白" aria-pressed="false"></button>
    <button type="button" class="swatch" style="--swatch:#292923" data-color="#292923" aria-label="墨黑" aria-pressed="false"></button>
  </div>
  <p id="paper-color-name">朱砂红</p>
</div>
<div class="tool-tip"><span>圈内剪去，圈外留下。</span><p>按下拖动绘制，松手自动连接首尾。用鼠标或单指均可操作；取消手势或窗口失焦会放弃当前未完成的轮廓。</p></div>
