# 静态资源（含开场视频）由 nginx 直出，支持 Range 请求，不经 Python。
# 动态页面反代到 web:8000（gunicorn）。
#
# 目录约定：静态文件位于 /usr/share/nginx/html/static/
#           请求 /static/xxx → /usr/share/nginx/html/static/xxx（用 root，不用 alias）

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 本站无文件上传，作品数据只在浏览器 localStorage
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;

    # 关键：静态资源一律 no-cache（每次协商，nginx 默认发 Last-Modified / ETag）。
    # 项目静态文件名不带内容哈希，长缓存会让浏览器复用旧模块、与新版本 import
    # 不匹配，曾直接导致工作台画布失效。图片/视频合计约 3.2 MB，协商开销可忽略。
    # nginx 静态模块原生支持 Range，开场视频可正常拖动/续传。
    location ^~ /static/ {
        add_header Cache-Control "no-cache" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
